<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!--Importing Frappe charts-->
    <script src="https://unpkg.com/frappe-charts@1.2.4/dist/frappe-charts.min.iife.js"></script>
    <!--Importing Bootstrap-->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/twitter-bootstrap/4.6.2/css/bootstrap.min.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-LN+7fdVzj6u52u30Kp6M/trliBMCMKTyK833zpbD+pXdCLuTusPj697FH4R/5mcr" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-ndDqU0Gzau9qJ1lfW4pNLlhNTkCfHzAVBReH9diLvGRem5+R9g2FzA8ZGN954O5Q"
        crossorigin="anonymous"></script>

    <!-- Latest compiled and minified CSS -->
    <link rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-select@1.13.14/dist/css/bootstrap-select.min.css">

    <!-- Latest compiled and minified JavaScript -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap-select@1.13.14/dist/js/bootstrap-select.min.js"></script>

    <!-- (Optional) Latest compiled and minified JavaScript translation files -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap-select@1.13.14/dist/js/i18n/defaults-*.min.js"></script>
    <!--Importing Google API-->
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/2.1.1/jquery.min.js"></script>
    <script type="text/javascript" src="https://maps.googleapis.com/maps/api/js?sensor=false"></script>
    <!--Importing Leaflet-->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
        integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
    <!-- Make sure you put this AFTER Leaflet's CSS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
        integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
    <script src="index.js" defer></script>
    <link rel="stylesheet" href="css.css">
    <title>Weather App</title>
</head>

<body>
    <header>
        <div id="header-div">
        </div>
        <section class="card-div">
                <div id="last-visited">Last visited:</div>
                <div id="favorites">Favorites:
                </div>
            </section>
        <button class="" id="geolocation">Use current location</button>
        <form action="submit">
            <input type="text" id="search-bar" placeholder="e.g. Kouvola">
            <button id="button-search">Search</button>
        </form>
        <button id="add-favorite">Favorite</button>
        <select class="" id="select-metrics">
            <option selected value="℃">Celsius</option>
            <option value="°F">Fahrenheit</option>
            <option value="K">Kelvin</option>
        </select>
        <p id="status"></p>
    </header>
    <main>
        <div class="row justify-content-center align-self-start">
            <div class=" col-12 col-md-4 card-div  align-self-start">
                <p id="city">Location</p>
                <img id="current-icon" src="assets/other/question-sign.png">
                <p id="temperature"></p>
                <p id="unit"></p>
                <p id="main-description">Description</p>
                <p id="feels-like">Feels like</p>
                <p id="sunrise">Sunrise</p>
                <p id="sunset">Sunset</p>
                <p id="humidity">Humidity</p>
                <p id="pressure">Pressure</p>
                <p id="visibility">Visibility</p>
                <p id="wind-deg">Wind degree</p>
                <p id="wind-speed">Wind speed</p>

                <div id="weather-summary">

                </div>
            </div>
            <div class="col-12 col-md-5 card-div  align-self-start">
                <input class="disabled" type="range" id="hours-slider" step="1">
                <select id="select-provider-chart" multiple>

                </select>
                <select id="select-weather-data" class="disabled">
                    <option>Temperature</option>
                    <option>Precip</option>
                    <option>Humidity</option>
                </select>
                <p>Temperature forecast for the next 24 hours</p>
                <div id="chart-container-div" class="card-div">
                    <div id="hourly-chart"></div>
                </div>
            </div>
        </div>
        <div class="row justify-content-center align-self-start">

            <div class="col-12 col-md-auto card-div  align-self-start">
                <p>Next 7 days</p>
                <select name="" id="general-provider-selector">
                </select>
                <div id="div-weekly" class=" row transparent">

                </div>
            </div>

        </div>


        <div id="map-div" class="row justify-content-center col-12 center-card card-div">
            <div id="map"></div>
        </div>
        </div>
        </div>
        </aside>
    </main>
    <footer>
        <p>Weather icons from <a href="https://www.flaticon.com/authors/freepik">FreePik at Flaticon</a></p>
    </footer>
</body>

</html>
